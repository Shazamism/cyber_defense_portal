apiVersion: apps/v1
kind: Deployment
metadata:
  name: integration-gateway
  namespace: defence-cyber-portal
  labels:
    app: integration-gateway
    tier: ingress
    workload_class: critical-realtime
spec:
  replicas: 2
  selector:
    matchLabels:
      app: integration-gateway
  template:
    metadata:
      labels:
        app: integration-gateway
        workload_class: critical-realtime
    spec:
      containers:
        - name: gateway
          image: defence-portal/integration-gateway:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: REDPANDA_BROKERS
              value: "redpanda-cluster.eventbus.svc.cluster.local:9092"
            - name: WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: webhook-secret
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /v1/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: integration-gateway
  namespace: defence-cyber-portal
spec:
  selector:
    app: integration-gateway
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway-pdb
  namespace: defence-cyber-portal
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: integration-gateway
