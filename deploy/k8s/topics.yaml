apiVersion: redpanda.vectorized.io/v1alpha1
kind: Topic
metadata:
  name: security-ingress-raw-v1
  namespace: eventbus
spec:
  partitions: 12
  replicationFactor: 3
  additionalConfig:
    retention.ms: "604800000" # 7 days
    cleanup.policy: "delete"
    min.insync.replicas: "2"
